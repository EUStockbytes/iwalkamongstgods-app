name: Nature Sounds regression tests

on:
  push:
    branches:
      - fix/nature-audio-service-worker-bypass-20261104
  pull_request:
    paths:
      - 'iwag-production/index.html'
      - 'iwag-production/sw.js'
      - 'iwag-production/api/nature-*.js'
      - 'iwag-production/api/_lib/nature-entitlement.js'
      - 'iwag-production/tests/nature-access.test.js'
      - '.github/workflows/nature-sounds-tests.yml'

permissions:
  contents: read

jobs:
  nature-regression:
    name: Protected audio and entitlement tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iwag-production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: iwag-production/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run Nature Sounds tests
        run: node --test tests/nature-access.test.js
