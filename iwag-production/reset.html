<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — I Walk Amongst Gods</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600&family=Cormorant+Garamond:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --deep: #020408;
      --panel: rgba(7, 12, 21, .92);
      --gold: #d6ad58;
      --gold-light: #f0d28b;
      --text: #eee8dc;
      --muted: #9c9588;
      --error: #e59898;
      --success: #b7d9b0;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 10%, rgba(87, 58, 128, .2), transparent 38%),
        radial-gradient(circle at 85% 80%, rgba(24, 88, 99, .14), transparent 42%),
        var(--deep);
      font-family: 'Cormorant Garamond', serif;
      display: grid;
      place-items: center;
      overflow-x: hidden;
    }

    #stars { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: rgba(255, 244, 210, .7);
      animation: twinkle var(--duration) ease-in-out infinite alternate;
      animation-delay: var(--delay);
    }
    @keyframes twinkle { from { opacity: .12; } to { opacity: .85; } }

    .reset-wrap {
      position: relative;
      z-index: 1;
      width: min(92vw, 480px);
      padding: 48px 0;
    }

    .brand { text-align: center; margin-bottom: 26px; }
    .brand a {
      color: var(--gold-light);
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(20px, 5vw, 28px);
      text-decoration: none;
      letter-spacing: 1px;
    }
    .brand p {
      margin: 8px 0 0;
      color: var(--muted);
      font-family: 'Cinzel', serif;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .reset-card {
      border: 1px solid rgba(214, 173, 88, .3);
      border-radius: 4px;
      background: var(--panel);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .55), inset 0 1px rgba(255, 255, 255, .03);
      padding: clamp(28px, 7vw, 44px);
      backdrop-filter: blur(12px);
    }
    h1 {
      margin: 0 0 10px;
      color: var(--gold-light);
      font-family: 'Cinzel', serif;
      font-size: 21px;
      font-weight: 600;
      letter-spacing: 2px;
      text-align: center;
      text-transform: uppercase;
    }
    .intro {
      margin: 0 0 26px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.55;
      text-align: center;
    }

    .message {
      display: none;
      margin-bottom: 22px;
      border: 1px solid rgba(229, 152, 152, .32);
      border-radius: 3px;
      padding: 12px 14px;
      color: var(--error);
      background: rgba(110, 35, 35, .14);
      font-size: 16px;
      line-height: 1.4;
      text-align: center;
    }
    .message.show { display: block; }
    .message.success {
      border-color: rgba(183, 217, 176, .3);
      color: var(--success);
      background: rgba(46, 92, 52, .14);
    }

    fieldset { margin: 0; border: 0; padding: 0; }
    fieldset:disabled { opacity: .48; }
    .form-group { margin-bottom: 18px; }
    label {
      display: block;
      margin-bottom: 8px;
      color: var(--gold-light);
      font-family: 'Cinzel', serif;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    input {
      width: 100%;
      border: 1px solid rgba(214, 173, 88, .25);
      border-radius: 3px;
      outline: none;
      padding: 13px 14px;
      color: var(--text);
      background: rgba(0, 0, 0, .26);
      font: 17px 'Cormorant Garamond', serif;
      transition: border-color .25s, box-shadow .25s;
    }
    input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 2px rgba(214, 173, 88, .1);
    }
    .reset-btn {
      width: 100%;
      margin-top: 4px;
      border: 1px solid var(--gold);
      border-radius: 3px;
      padding: 14px;
      color: #161109;
      background: linear-gradient(135deg, var(--gold-light), var(--gold));
      cursor: pointer;
      font: 600 11px 'Cinzel', serif;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .reset-btn:disabled { cursor: not-allowed; opacity: .6; }
    .back { margin-top: 24px; text-align: center; }
    .back a {
      color: var(--muted);
      font-family: 'Cinzel', serif;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-decoration: none;
      text-transform: uppercase;
    }
    .back a:hover { color: var(--gold); }
  </style>
</head>
<body>
  <div id="stars" aria-hidden="true"></div>
  <main class="reset-wrap">
    <div class="brand">
      <a href="/index.html">I Walk Amongst Gods</a>
      <p>Divine Wellness Portal</p>
    </div>

    <section class="reset-card" aria-labelledby="resetTitle">
      <h1 id="resetTitle">Reset Password</h1>
      <p class="intro" id="statusText">Validating your secure recovery link…</p>
      <div class="message" id="message" role="alert" aria-live="polite"></div>

      <form id="resetForm" novalidate>
        <fieldset id="passwordFields" disabled>
          <div class="form-group">
            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword" autocomplete="new-password" minlength="8" required>
          </div>
          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" autocomplete="new-password" minlength="8" required>
          </div>
          <button class="reset-btn" id="updateButton" type="submit">Update Password</button>
        </fieldset>
      </form>
    </section>

    <div class="back"><a href="/login.html">← Return to Sign In</a></div>
  </main>

  <noscript>This page requires JavaScript to securely reset your password.</noscript>
  <script src="/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const initialUrl = new URL(window.location.href);
    const initialHash = new URLSearchParams(initialUrl.hash.slice(1));
    const recoveryHint = initialHash.get('type') === 'recovery' ||
      initialUrl.searchParams.get('type') === 'recovery';
    const recoveryError = initialHash.get('error_description') ||
      initialUrl.searchParams.get('error_description');

    const { createClient } = supabase;
    const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const passwordFields = document.getElementById('passwordFields');
    const statusText = document.getElementById('statusText');
    const message = document.getElementById('message');
    const updateButton = document.getElementById('updateButton');
    let recoveryReady = false;
    let validationStarted = false;
    let recoveryEventPending = false;

    function clearRecoveryUrl() {
      history.replaceState({}, document.title, window.location.pathname);
    }

    function showMessage(text, type = 'error') {
      message.textContent = text;
      message.className = `message show${type === 'success' ? ' success' : ''}`;
    }

    function rejectRecovery(text) {
      recoveryReady = false;
      passwordFields.disabled = true;
      statusText.textContent = 'This recovery link cannot be used.';
      showMessage(text);
      clearRecoveryUrl();
    }

    async function validateRecoverySession(session) {
      recoveryEventPending = false;
      if (validationStarted || recoveryReady) return;
      validationStarted = true;

      if (!session?.access_token) {
        rejectRecovery('This password reset link is invalid or has expired. Please request a new link.');
        return;
      }

      const { data, error } = await sb.auth.getUser();
      if (error || !data?.user) {
        rejectRecovery('This password reset link is invalid or has expired. Please request a new link.');
        return;
      }

      recoveryReady = true;
      clearRecoveryUrl();
      statusText.textContent = 'Choose a new password with at least 8 characters.';
      message.className = 'message';
      message.textContent = '';
      passwordFields.disabled = false;
      document.getElementById('newPassword').focus();
    }

    sb.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY' && session) {
        recoveryEventPending = true;
        window.setTimeout(() => validateRecoverySession(session), 0);
      }
    });

    async function initializeRecovery() {
      if (recoveryError) {
        rejectRecovery('This password reset link is invalid or has expired. Please request a new link.');
        return;
      }

      const { data, error } = await sb.auth.getSession();
      if (error) {
        if (recoveryEventPending) return;
        rejectRecovery('The recovery session could not be verified. Please request a new password reset link.');
        return;
      }

      if (!validationStarted && recoveryHint && data?.session) {
        await validateRecoverySession(data.session);
        return;
      }

      if (!validationStarted && !recoveryReady && !recoveryEventPending) {
        rejectRecovery('No valid password recovery session was found. Please request a new reset link.');
      }
    }

    document.getElementById('resetForm').addEventListener('submit', async event => {
      event.preventDefault();
      if (!recoveryReady) {
        rejectRecovery('Your recovery session is no longer valid. Please request a new reset link.');
        return;
      }

      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (newPassword.length < 8) {
        showMessage('Password must be at least 8 characters.');
        return;
      }
      if (newPassword !== confirmPassword) {
        showMessage('The passwords do not match.');
        return;
      }

      updateButton.disabled = true;
      updateButton.textContent = 'Updating…';
      const { error } = await sb.auth.updateUser({ password: newPassword });

      if (error) {
        showMessage(error.message || 'Your password could not be updated. Please request a new reset link.');
        updateButton.disabled = false;
        updateButton.textContent = 'Update Password';
        return;
      }

      passwordFields.disabled = true;
      statusText.textContent = 'Your password has been updated.';
      showMessage('Password updated successfully. Returning you to sign in…', 'success');

      const { error: signOutError } = await sb.auth.signOut();
      if (signOutError) {
        showMessage('Your password was updated, but the recovery session could not be closed. Please close this window before signing in.', 'error');
        return;
      }

      window.location.replace('/login.html?reset=success');
    });

    const stars = document.getElementById('stars');
    for (let i = 0; i < 90; i++) {
      const star = document.createElement('span');
      star.className = 'star';
      star.style.left = `${Math.random() * 100}%`;
      star.style.top = `${Math.random() * 100}%`;
      star.style.setProperty('--duration', `${Math.random() * 4 + 2}s`);
      star.style.setProperty('--delay', `-${Math.random() * 6}s`);
      stars.appendChild(star);
    }

    initializeRecovery();
  </script>
</body>
</html>
